<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Logo Badan Narkotika Nasional">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dc7a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7420"/>
    </linearGradient>
    <radialGradient id="navyGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#163a5c"/>
      <stop offset="100%" stop-color="#081526"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Outer gold ring -->
    <circle cx="70" cy="70" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Inner circle -->
    <circle cx="70" cy="70" r="54" fill="url(#navyGrad)" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Decorative inner ring -->
    <circle cx="70" cy="70" r="46" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.5"/>

    <!-- Stylized shield / emblem -->
    <path
      d="M70 32 C78 32 84 36 88 40 V56 C88 68 81 78 70 86 C59 78 52 68 52 56 V40 C56 36 62 32 70 32 Z"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="1.8"
      opacity="0.9"
    />
    <!-- Star accent -->
    <polygon
      points="70,38 71.8,43.5 77.5,43.5 72.8,47 74.6,52.5 70,49 65.4,52.5 67.2,47 62.5,43.5 68.2,43.5"
      fill="#d4af37"
      opacity="0.85"
    />

    <!-- BNN text -->
    <text
      x="70"
      y="72"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="22"
      font-weight="800"
      fill="url(#goldGrad)"
      letter-spacing="2"
    >BNN</text>

    <!-- RI subtitle -->
    <text
      x="70"
      y="86"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="8"
      font-weight="600"
      fill="#e8c547"
      letter-spacing="2.5"
    >RI</text>
  </g>
</svg>
